<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mizer Limited</title>
    <link rel="stylesheet" href="style.css">
    <!-- Giscus Yorum Sistemi (Daha sonra kendi repo bilgilerinle güncellenecek) -->
    <script src="https://giscus.app/client.js"
        data-repo="SENIN_GITHUB_KULLANICI_ADIN/SENIN_REPO_ADIN"
        data-repo-id="SENIN_REPO_ID"
        data-category="General"
        data-category-id="SENIN_CATEGORY_ID"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="tr"
        crossorigin="anonymous"
        async>
    </script>
</head>
<body>
    <header>
        <div class="logo">Mizer Limited</div>
        <nav>
            <select id="lang-select">
                <option value="tr">🇹🇷 Türkçe</option>
                <option value="en">🇬🇧 English</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="es">🇪🇸 Español</option>
                <option value="pt">🇵🇹 Português</option>
                <option value="ru">🇷🇺 Русский</option>
            </select>
            <select id="theme-select">
                <option value="dark">🌑 Koyu (Dark)</option>
                <option value="light">☀️ Açık (Light)</option>
                <option value="neon">🟣 Mor / Neon</option>
                <option value="corporate">🔵 Mavi / Kurumsal</option>
                <option value="nature">🌿 Yeşil / Doğa</option>
                <option value="aggressive">🔴 Kırmızı / Agresif</option>
                <option value="ocean">🌊 Okyanus</option>
                <option value="sunset">🌅 Gün Batımı</option>
                <option value="monochrome">🏁 Monokrom</option>
            </select>
            <a href="/admin/" class="admin-btn" data-i18n="admin_panel">Yönetim</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1 data-i18n="hero_title">Mizer Limited Projeleri</h1>
            <p data-i18n="hero_subtitle">Güvenli, hızlı ve tamamen ücretsiz proje çözümleri.</p>
            <button id="nova-toggle" class="nova-btn">🤖 Nova'ya Sor</button>
        </section>

        <section id="projects-container" class="projects-grid">
            <!-- Projeler JavaScript ile buraya otomatik yüklenecek -->
        </section>

        <section class="contact">
            <h2 data-i18n="contact_title">İletişim</h2>
            <p>📧 mzerlimited@gmail.com</p>
        </section>

        <!-- Giscus Yorum Alanı -->
        <section class="comments">
            <h3 data-i18n="comments_title">Yorumlar</h3>
            <div class="giscus-placeholder">Giscus yorumları burada yüklenecek.</div>
        </section>
    </main>

    <!-- Nova Yapay Zeka Penceresi -->
    <div id="nova-chat" class="nova-chat hidden">
        <div class="nova-header">
            <span>🤖 Nova</span>
            <button id="nova-close">✕</button>
        </div>
        <div id="nova-messages" class="nova-messages"></div>
        <div class="nova-input-area">
            <input type="text" id="nova-input" placeholder="Nova'ya bir şey sor...">
            <button id="nova-send">➤</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
